<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<title>snap2read — 찍으면 읽어줍니다</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 16px 14px calc(24px + env(safe-area-inset-bottom));
    background: linear-gradient(160deg, #0f172a, #1e293b 60%, #0b1120);
    color: #e2e8f0; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 640px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; letter-spacing: .3px; }
  .sub { color: #94a3b8; font-size: 12.5px; margin-bottom: 14px; }
  .card {
    background: rgba(30,41,59,.75); border: 1px solid #334155; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; backdrop-filter: blur(6px);
  }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
  select, button { font-size: 15px; font-family: inherit; }
  select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #475569;
    background: #0f172a; color: #e2e8f0;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 14px; }
  .big {
    width: 100%; margin-top: 12px; padding: 15px; border: 0; border-radius: 14px;
    background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
    font-size: 16.5px; font-weight: 700; cursor: pointer;
  }
  .big:active { transform: scale(.985); }
  .big[disabled] { opacity: .55; cursor: wait; }
  #shot { display: none; }
  .status { display: flex; align-items: center; gap: 10px; margin: 4px 0; font-size: 14.5px; }
  .spin {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 2.5px solid #475569; border-top-color: #38bdf8;
    animation: r 1s linear infinite; display: none;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .err { color: #fca5a5; font-size: 14px; white-space: pre-wrap; }
  .ts { white-space: pre-wrap; line-height: 1.75; font-size: 15.5px; }
  .ko { color: #a5b4fc; line-height: 1.75; font-size: 14.5px;
        border-top: 1px dashed #334155; margin-top: 10px; padding-top: 10px; }
  #edit { width: 100%; min-height: 130px; padding: 10px; border-radius: 10px;
          border: 1px solid #475569; background: #0b1220; color: #e2e8f0;
          font: inherit; font-size: 15px; line-height: 1.6; resize: vertical; }
  .hint { color: #64748b; font-size: 12px; margin-top: 4px; }
  audio { width: 100%; margin-top: 10px; }
  .dl {
    display: inline-block; margin-top: 10px; padding: 10px 16px; border-radius: 10px;
    background: #0ea5e9; color: #04283a; font-weight: 700; text-decoration: none;
  }
  .ratebox { margin-top: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ratelabel { color: #64748b; font-size: 13px; }
  .ratebtn { padding: 6px 12px; border-radius: 8px; border: 1px solid #cbd5e1;
             background: #fff; color: #0f172a; font-weight: 600; cursor: pointer; }
  .ratebtn.on { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
  .ms { color: #64748b; font-size: 12px; margin-top: 8px; }
  .empty { color: #64748b; font-size: 13px; }
</style>
</head>
<body>
  <h1>📸 snap2read</h1>
  <div class="sub">페이지를 찍으면 PC가 읽어줍니다 · 스트리밍 재생 · MP3 저장 · <a href="/teacher" style="color:#93c5fd">교사용 화면 →</a></div>

  <div class="card">
    <label for="lang">책의 언어</label>
    <select id="lang">
      <option value="eng" selected>영어</option>
      <option value="kor">한국어</option>
      <option value="jpn">일본어</option>
      <option value="chi_sim">중국어(간체)</option>
      <option value="rus">러시아어</option>
      <option value="vie">베트남어</option>
      <option value="spa">스페인어</option>
      <option value="fra">프랑스어</option>
      <option value="deu">독일어</option>
    </select>
    <div class="row">
      <span class="chk"><input type="checkbox" id="auto" checked> 완료 시 자동 재생</span>
    </div>
    <button class="big" id="go">📷 사진 찍기 / 선택</button>
    <input type="file" id="shot" accept="image/*" capture="environment">
  </div>

  <div class="card" id="out" style="display:none">
    <div class="status"><span class="spin" id="spin"></span><span id="st">대기 중…</span></div>
    <div class="err" id="err"></div>
    <div class="ts" id="ts"></div>
    <div class="ko" id="ko" style="display:none"></div>
    <div id="editbox" style="display:none">
      <label for="edit">인식 결과 수정 (잘못된 글자를 고치고 다시 읽어주기)</label>
      <textarea id="edit"></textarea>
      <div class="hint">수정 후 아래 ‘🔁 다시 읽기’를 누르면 수정된 문장으로 새 음성을 만듭니다.</div>
    </div>
    <audio id="au" controls preload="none" style="display:none"></audio>
    <div class="ratebox" id="ratebox" style="display:none">
      <span class="ratelabel">말하기 속도</span>
      <button class="ratebtn" data-rate="-60%">더 느림</button>
      <button class="ratebtn" data-rate="-30%">느림</button>
      <button class="ratebtn" data-rate="+0%">보통</button>
      <button class="ratebtn" data-rate="+15%">빠름</button>
    </div>
    <a class="dl" id="rr" style="display:none" download>🔁 다시 읽기</a>
    <a class="dl" id="tl" style="display:none">🌐 번역</a>
    <a class="dl" id="dl" style="display:none" download>⬇ MP3/WAV 저장</a>
    <div class="ms" id="ms"></div>
  </div>

<script>
const $ = id => document.getElementById(id);
const LANG_NAME = {eng:"영어",kor:"한국어",jpn:"일본어",chi_sim:"중국어",rus:"러시아어",vie:"베트남어",spa:"스페인어",fra:"프랑스어",deu:"독일어"};
let polling = null;

$("go").onclick = () => $("shot").click();

$("shot").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("out").style.display = "block";
  $("err").textContent = ""; $("ts").textContent = ""; $("edit").value = "";
  $("ko").textContent = ""; $("ko").style.display = "none";   // 이전 번역 즉시 제거 (잔존 버그 수정)
  $("tl").dataset.job = "";                                   // 이전 작업에 연결된 번역 버튼 무력화
  $("editbox").style.display = "none"; $("rr").style.display = "none"; $("tl").style.display = "none";
  $("au").style.display = "none"; $("dl").style.display = "none"; $("ms").textContent = "";
  $("spin").style.display = "inline-block"; $("st").textContent = "사진 전송 중…";
  $("go").disabled = true;
  if (polling) clearInterval(polling);

  // 배속 버튼 UI 표시 + 현재 선택 표시
  $("ratebox").style.display = "flex";
  const savedRate = localStorage.getItem("s2r_rate") || "+0%";
  document.querySelectorAll(".ratebtn").forEach(b =>
    b.classList.toggle("on", b.dataset.rate === savedRate));

  try {
    const fd = new FormData();
    fd.append("image", f, "photo.jpg");
    fd.append("lang", $("lang").value);
    fd.append("rate", localStorage.getItem("s2r_rate") || "+0%");
    const r = await fetch("/api/process", { method: "POST", body: fd });
    if (!r.ok) throw new Error("업로드 실패 (" + r.status + ")");
    const { id } = await r.json();
    poll(id);
  } catch (err) {
    fail(err.message);
  } finally {
    e.target.value = "";            // 같은 사진 재선택 허용
    $("go").disabled = false;
  }
};

function poll(id) {
  const STAGE = { queued:"대기 중…", ocr:"글자 인식 중…", tts:"목소리 만드는 중…" };
  let curId = id;
  polling = setInterval(async () => {
    try {
      const j = await (await fetch("/api/status/" + id)).json();
      if (j.status === "error") { clearInterval(polling); return fail(j.error || "처리 실패"); }
      if (!j.text) $("ts").textContent = "";        // 이전 작업 결과 잔존 방지
      $("st").textContent = STAGE[j.status] || j.status;
      if (j.text)    $("ts").textContent = j.text;
      if (j.status !== "done") return;
      clearInterval(polling);
      $("spin").style.display = "none";
      // 수정 UI 활성화 — OCR 결과를 그대로 담아 사용자가 고칠 수 있게
      $("edit").value = j.text;
      $("editbox").style.display = "block";
      $("rr").style.display = "inline-block";
      $("tl").style.display = "inline-block";      // LLM 번역 버튼 (서버가 준비됐을 때만 눌림)
      $("rr").dataset.job = id; $("tl").dataset.job = id;
      const au = $("au"), src = "/api/audio/" + id;
      au.src = src; au.style.display = "block";
      $("dl").href = src; $("dl").download = "snap2read." + (j.audio_ext || "mp3");
      $("dl").style.display = "inline-block";
      if (j.text) $("ts").textContent = j.text;
      $("ms").textContent = "⏱ 처리 " + ((j.ms / 1000) || "?") + "초" +
        " (인식 " + (((j.ocr_ms || 0) / 1000) || "?") + "s · 말하기 " +
        (((j.tts_ms || 0) / 1000) || "?") + "s)" +
        " · 목소리 " + (LANG_NAME[$("lang").value] || $("lang").value) +
        " · " + (j.audio_ext === "wav" ? "PC 오프라인 음성(SAPI)" : "자연 음성(edge-tts)");
      if ($("auto").checked) au.play().catch(() => {});
    } catch (e) { /* 네트워크 순간 끊김 — 다음 폴링에서 재시도 */ }
  }, 700);
}

// LLM 번역 — 스트리밍으로 번역 칸에 실시간 표시 (수정된 텍스트 기준)
$("tl").onclick = async () => {
  const id = $("tl").dataset.job;
  const text = ($("edit").value || $("ts").textContent).trim();
  if (!id || !text) return;
  $("tl").style.opacity = ".5";
  const ko = $("ko");
  ko.style.display = "block"; ko.textContent = "";
  try {
    const fd = new FormData();
    fd.append("text", text);
    const r = await fetch("/api/translate/" + id, { method: "POST", body: fd });
    if (!r.ok) {
      const msg = await r.text();
      ko.textContent = "⚠️ " + (msg || "번역 실패");
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      ko.textContent += dec.decode(value, { stream: true });
    }
  } catch (e) {
    ko.textContent = "⚠️ 번역 중단: " + e.message;
  } finally {
    $("tl").style.opacity = "";
  }
};

// 수정된 텍스트로 다시 읽어주기
// 배속 버튼 — 클릭 시 선택 저장 + 현재 음성을 해당 속도로 재생성
  document.querySelectorAll(".ratebtn").forEach(btn => {
    btn.onclick = async () => {
      localStorage.setItem("s2r_rate", btn.dataset.rate);
      document.querySelectorAll(".ratebtn").forEach(b =>
        b.classList.toggle("on", b === btn));
      // 현재 작업이 있으면 같은 텍스트로 느린 음성 재생성
      const id = $("rr").dataset.job;
      const text = ($("edit").value.trim() || $("ts").textContent.trim());
      if (id && text) {
        $("st").textContent = "속도 변경 중…";
        const fd = new FormData();
        fd.append("text", text);
        fd.append("rate", btn.dataset.rate);
        try {
          const r = await fetch("/api/reread/" + id, { method: "POST", body: fd });
          if (r.ok) {
            const src = "/api/audio/" + id + "?v=" + Date.now();
            $("au").src = src; $("au").style.display = "block";
            $("dl").href = src;
            $("st").textContent = "완료";
            $("au").play().catch(() => {});
          }
        } catch (e) { /* 무시 */ }
      }
    };
  });

$("rr").onclick = async () => {  const id = $("rr").dataset.job;
  const text = $("edit").value.trim();
  if (!id || !text) return;
  $("rr").disabled = true;
  $("st").textContent = "수정된 문장으로 다시 만드는 중…";
  $("spin").style.display = "inline-block";
  try {
    const fd = new FormData();
    fd.append("text", text);
    fd.append("rate", localStorage.getItem("s2r_rate") || "+0%");
    const r = await fetch("/api/reread/" + id, { method: "POST", body: fd });
    if (!r.ok) throw new Error("다시 읽기 실패 (" + r.status + ")");
    const j = await r.json();
    $("st").textContent = "완료";
    $("spin").style.display = "none";
    $("ts").textContent = text;
    const src = "/api/audio/" + id + "?v=" + Date.now();
    $("au").src = src; $("au").style.display = "block";
    $("dl").href = src; $("dl").download = "snap2read_fixed." + (j.audio_ext || "mp3");
    $("dl").style.display = "inline-block";
    $("ms").textContent = "🔁 수정 반영 완료 · " + (j.audio_ext === "wav" ? "PC 오프라인 음성(SAPI)" : "자연 음성(edge-tts)");
    $("au").play().catch(() => {});
  } catch (e) {
    fail(e.message);
  } finally {
    $("rr").disabled = false;
  }
};

function fail(msg) {
  if (polling) clearInterval(polling);
  polling = null;
  $("spin").style.display = "none"; $("st").textContent = "실패";
  $("err").textContent = "⚠️ " + msg;
}
</script>
</body>
</html>
